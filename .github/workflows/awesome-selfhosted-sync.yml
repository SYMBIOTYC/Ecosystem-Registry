name: Sync awesome-selfhosted catalog

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: awesome-selfhosted-catalog-sync
  cancel-in-progress: false

jobs:
  import-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check --no-input "PyYAML==6.0.2"
      - name: Import immutable upstream snapshot
        run: python tools/awesome_selfhosted_sync.py --output registry/catalogs/awesome-selfhosted.jsonl
      - name: Open catalog update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          snapshot="registry/catalogs/awesome-selfhosted.jsonl"
          if git diff --quiet -- "$snapshot"; then
            echo "Catalog snapshot is unchanged."
            exit 0
          fi
          branch="automation/awesome-selfhosted-catalog-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$snapshot"
          git commit -m "chore: refresh awesome-selfhosted catalog snapshot"
          git push --set-upstream origin "$branch"
          gh pr create \
            --repo "$GH_REPO" \
            --base main \
            --head "$branch" \
            --title "chore: refresh awesome-selfhosted catalog snapshot" \
            --body "Automated read-only import from awesome-selfhosted-data. The snapshot records the exact upstream commit, catalog attribution and CC-BY-SA-3.0 license. This PR changes discovery metadata only; it does not authorize tools or enable invocations."
