name: Ecosystem registry validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check --no-input "PyYAML==6.0.2"
      - name: Run registry and catalog tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
